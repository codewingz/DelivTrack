align-items:center;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:800;white-space:nowrap}.pending{color:#965110;background:#FFF1D6}.paid{color:var(--green);background:#DCFCE7}.overdue{color:var(--red);background:#FEE2E2}.credit{color:var(--purple);background:#F0E8FF}.advance{color:var(--blue);background:#E0F2FE}.free{color:#64748B;background:#F1F5F9}.returned{color:var(--red);background:#FEE2E2}.draft{color:#6B7280;background:#F3F4F6}.primary{border:0;background:var(--primary);color:white;font-weight:750;border-radius:12px;padding:13px 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.secondary{border:1px solid var(--line);color:var(--primary);background:white;border-radius:12px;padding:12px 14px;font-weight:750}.danger{background:#fff0f0;color:var(--red);border:1px solid #ffd6d6;padding:12px;border-radius:12px;font-weight:700}.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:800;color:#405F52}.field input,.field select,.field textarea{border:1px solid #D6E5DE;background:white;border-radius:12px;padding:12px 12px;width:100%;min-height:44px;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #176b561a}.field textarea{min-height:72px;resize:vertical}.formgroup{background:white;border:1px solid var(--line);padding:15px;border-radius:17px;margin:0 0 12px}.formtitle{font-weight:850;font-size:14px;margin:0 0 15px}.tip{background:#E5F3EE;border:1px solid #D3EADF;border-radius:12px;color:#336D59;padding:12px;font-size:12px;line-height:1.5;margin:11px 0}.warn{background:#FFF5DE;color:#81550B;border-color:#F4E0B3}.err{background:#FEF0F0;color:#9A2828;border-color:#F3D3D3}.search{background:white;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;padding:0 12px;gap:8px;margin-bottom:11px}.search span{color:#8a9b91;font-size:19px}.search input{border:0;outline:0;flex:1;padding:13px 3px;min-width:0}.chips{display:flex;gap:8px;overflow:auto;margin:6px 0 14px;padding-bottom:3px}.chip{border:1px solid #D8E6DE;background:white;padding:8px 12px;border-radius:40px;font-size:12px;white-space:nowrap;color:#597567}.chip.on{background:var(--primary);color:white;border-color:var(--primary)}.pillline{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.div{border-top:1px solid var(--line);margin:14px 0}.empty{text-align:center;padding:37px 20px;color:var(--muted);font-size:13px}.empty div{font-size:34px;margin-bottom:9px}.modalbg{position:absolute;inset:0;background:#10271cc9;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-height:93%;border-radius:24px 24px 0 0;overflow:auto;padding:17px 18px 30px}.sheet .handle{height:5px;width:44px;background:#cadbd0;border-radius:4px;margin:0 auto 17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ghost{background:#f2f8f4;border-radius:10px;padding:12px;font-size:12px}.money{color:var(--primary);font-weight:850}.toast{position:absolute;z-index:100;bottom:84px;left:20px;right:20px;background:#183B2B;color:white;padding:13px 16px;border-radius:14px;font-size:13px;box-shadow:var(--shadow);text-align:center}.labelrow{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eff3f0;font-size:13px}.labelrow>span:first-child{color:var(--muted)}.labelrow>span:last-child{font-weight:700;text-align:right;max-width:65%;overflow-wrap:anywhere}.fixedadd{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 25%);padding-top:12px}.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:33px}.loginlogo{width:92px;height:92px;border-radius:25px;object-fit:cover;margin-bottom:19px}.login h1{font-size:32px;margin:0}.login p{color:var(--muted);font-size:13px;line-height:1.6;margin:7px 0 25px}.banner{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);padding:12px;border-radius:14px;margin:8px 0}.circle{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#E5F3EE;color:var(--primary);font-size:19px;flex:none}.info{font-size:11px;color:var(--muted);line-height:1.55}.listitem{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #edf2ee}.listitem:last-child{border:0}.tabline{display:flex;border-bottom:1px solid var(--line);gap:12px;margin-bottom:14px}.tabline button{border:0;background:transparent;padding:11px 4px;color:var(--muted);font-weight:700;font-size:12px}.tabline button.on{border-bottom:3px solid var(--primary);color:var(--primary)}

(()=>{'use strict';const K='delivtrack_prototype_v1';const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'});const now=()=>new Date().toISOString();const days=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'})};const fmt=n=>'Rs. '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:0});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const init=()=>{let p=[{id:'p1',name:'Premium Cattle Feed',weight:5,active:true},{id:'p2',name:'Mineral Mix',weight:1,active:true},{id:'p3',name:'Farm Supplement',weight:.5,active:true}];let c=[{id:'c1',name:'Ahmed Raza',phone:'03001234567'},{id:'c2',name:'Bilal Farm',phone:'03009876543'},{id:'c3',name:'Hamza Ali',phone:''}];let parcels=[{id:'z1',num:'ADT-000001',date:days(-9),customer:'c1',items:[{id:'p1',name:'Premium Cattle Feed',qty:2}],weight:10,service:'VPP',ref:'VPP-852001',charge:560,method:'postal',expected:6500,status:'sent',payments:[],note:'',due:'',remind:'',returnDate:'',returnReason:''},{id:'z2',num:'ADT-000002',date:days(-7),customer:'c2',items:[{id:'p2',name:'Mineral Mix',qty:3}],weight:3,service:'VPL',ref:'VPL-852002',charge:420,method:'credit',expected:4800,status:'sent',payments:[],note:'Call customer before due date',due:days(-1),remind:days(-1),returnDate:'',returnReason:''},{id:'z3',num:'ADT-000003',date:days(-5),customer:'c3',items:[{id:'p3',name:'Farm Supplement',qty:1}],weight:.5,service:'VPL',ref:'VPL-852003',charge:280,method:'advance',expected:1500,status:'sent',payments:[{id:'pay1',amount:1500,date:days(-5),created:now(),note:'Advance paid'}],note:'',due:'',remind:'',returnDate:'',returnReason:''},{id:'z4',num:'ADT-000004',date:days(-3),customer:'c1',items:[{id:'p1',name:'Premium Cattle Feed',qty:1}],weight:5,service:'VPL',ref:'VPL-852004',charge:560,method:'gift',expected:0,status:'sent',payments:[],note:'Gift to old customer',due:'',remind:'',returnDate:'',returnReason:''},{id:'z5',num:'ADT-000005',date:days(-2),customer:'c2',items:[{id:'p1',name:'Premium Cattle Feed',qty:1},{id:'p2',name:'Mineral Mix',qty:1}],weight:6,service:'VPP',ref:'VPP-852005',charge:780,method:'postal',expected:4100,status:'returned',payments:[],note:'',due:'',remind:'',returnDate:days(-1),returnReason:'Customer did not collect'}];return{products:p,customers:c,parcels,seq:5,logged:true,company:'DelivTrack',prefs:{notify:true},logs:[]}};let data;try{data=JSON.parse(localStorage.getItem(K))||init()}catch{data=init()}const upgrade=()=>{if(data.schemaVersion===2)return;
  (data.products||[]).forEach(p=>{p.unit=p.unit||((p.id==='p1')?'kg':'piece')});
  (data.customers||[]).forEach((c,i)=>{if(!c.address)c.address=['Lahore, Punjab','Okara, Punjab','Sahiwal, Punjab'][i%3]});
  (data.parcels||[]).forEach(p=>{let arr=p.items||[],oldAmount=Number(p.expected||0);let weights=arr.map(i=>{let prod=data.products.find(pr=>pr.id===i.id);return prod?.unit==='kg'?((prod.weight||0)*Number(i.qty||1)):Number(i.qty||1)});let divisor=weights.reduce((a,b)=>a+b,0)||1;
    arr.forEach((i,index)=>{let prod=data.products.find(pr=>pr.id===i.id);i.unit=i.unit||prod?.unit||'piece';i.amount=Number(i.amount??weights[index]);i.unitPrice=Number(i.unitPrice??(p.method==='gift'?0:oldAmount/divisor));});
    p.serviceCustom=p.serviceCustom||'';
  });data.schemaVersion=2;
};upgrade();const save=()=>{try{localStorage.setItem(K,JSON.stringify(data))}catch(e){toast('Browser storage is full.')}};let customerDraft=null,customerReturnScreen='customers';let screen='home',filter='All',q='',modal=null,draft=null,editId=null,toastTimer=null,tab='overview',dateFilter='',productFilter='',statusFilter='All',methodFilter='All';const app=document.getElementById('app');const paid=p=>(p.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);const out=p=>Math.max(0,Number(p.expected||0)-paid(p));const ps=p=>p.method==='gift'?'Free':out(p)===0?'Received':paid(p)>0?'Partial':p.method==='credit'&&p.due&&p.due<today()?'Overdue':'Pending';const cls=s=>({Received:'paid',Pending:'pending',Overdue:'overdue',Partial:'advance',Free:'free',Returned:'returned',Draft:'draft',Credit:'credit'})[s]||'pending';const badge=(s)=>`<span class="pill ${cls(s)}">${esc(s)}</span>`;const cname=p=>data.customers.find(c=>c.id===p.customer)?.name||'Unknown';const itemnames=p=>(p.items||[]).map(x=>`${itemQty(x)} ${unitOf(x)==='kg'?'kg':'pcs'} × ${x.name}`).join(', ');const unitOf=i=>i.unit||data.products.find(p=>p.id===i.id)?.unit||'piece';
const itemQty=i=>Number(i.amount??i.qty??0);
const itemTotal=i=>itemQty(i)*Number(i.unitPrice||0);
const calcExpected=d=>d.method==='gift'?0:Math.round((d.items||[]).reduce((sum,i)=>sum+itemTotal(i),0)*100)/100;
const serviceOf=p=>p.service==='Other'?(p.serviceCustom||'Other'):p.service;
const autoService=m=>m==='postal'?'VPP':'VPL';
const unreceived=()=>data.parcels.filter(p=>out(p)>0);const rems=()=>data.parcels.filter(p=>p.method==='credit'&&out(p)>0&&p.status!=='returned').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
const reminderDue=p=>Boolean((p.remind&&p.remind<=today())||(p.due&&p.due<=today()));
const notifyCount=()=>data.prefs.notify?rems().filter(reminderDue).length:0;
const pillmethod=m=>({postal:'Post office collection',advance:'Advance paid',credit:'Pay Later',gift:'Gift / Free'})[m]||m;
const maybeNotify=()=>{if(!data.prefs.notify||!('Notification' in window)||Notification.permission!=='granted')return;
 let items=rems().filter(reminderDue);let todayKey=today();items.forEach(p=>{let k='delivtrack_alert_'+p.id+'_'+todayKey;if(localStorage.getItem(k))return;try{new Notification('DelivTrack · Pay Later reminder',{body:p.num+' · '+cname(p)+' · '+fmt(out(p))+' outstanding',tag:'due-'+p.id});localStorage.setItem(k,'1')}catch(e){}});
};const select=(items,v='',placeholder='Select')=>`<option value="">${placeholder}</option>`+items.map(x=>`<option value="${esc(x.value)}" ${String(x.value)===String(v)?'selected':''}>${esc(x.label)}</option>`).join('');function toast(msg){let el=document.querySelector('.toast');if(el)el.remove();el=document.createElement('div');el.className='toast';el.textContent=msg;app.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2900)}function show(s){screen=s;modal=null;render()}function open(m){modal=m;render()}const right=()=>`<button class="iconbtn" data-act="notifications" aria-label="Reminders">🔔${notifyCount()?`<span class="counter">${notifyCount()}</span>`:''}</button>`;const nav=()=>`<nav class="nav"><button class="${screen==='home'?'active':''}" data-nav="home"><span class="sym">⌂</span>Home</button><button class="${screen==='parcels'?'active':''}" data-nav="parcels"><span class="sym">▤</span>Parcels</button><button class="addnav" data-nav="add"><span class="sym">＋</span></button><button class="${screen==='payments'?'active':''}" data-nav="payments"><span class="sym">▣</span>Payments</button><button class="${screen==='more'?'active':''}" data-nav="more"><span class="sym">☷</span>More</button></nav>`;const parcelcard=p=>`<div class="card click" data-openparcel="${p.id}"><div class="cardhead"><b>${esc(p.num)}</b>${p.status==='returned'?badge('Returned'):badge(ps(p))}</div><div class="small mt">${esc(cname(p))} · ${esc(p.date)}</div><div class="small mt" style="white-space:nowrap;text-overflow:ellipsis;overflow:hidden">${esc(itemnames(p))}</div><div class="row mt"><span class="small">${esc(serviceOf(p)||'Not booked')} · ${esc(p.ref||'Awaiting number')}</span><span class="money">${fmt(out(p))}</span></div>${p.status==='returned'?'<div class="small mt" style="color:var(--red)">⚑ Returned · payment review needed</div>':''}</div>`;
function home(){const unpaid=unreceived(),received=data.parcels.reduce((s,p)=>s+paid(p),0),due=notifyCount();return `<div class="heading"><div><h1>Good ${new Date().getHours()<12?'morning':'day'} 👋</h1><p>Here’s your parcel & payment overview</p></div><button class="iconbtn" data-nav="reports">↗</button></div><div class="hero"><small>Total outstanding payment</small><div class="amt">${fmt(unpaid.reduce((s,p)=>s+out(p),0))}</div><div class="under">◷ ${unpaid.length} parcels awaiting payment</div></div><div class="grid2"><div class="metric"><i>▣</i><small>Total parcels</small><strong>${data.parcels.length}</strong></div><div class="metric"><i style="color:var(--green)">✓</i><small>Money received</small><strong style="font-size:18px">${fmt(received)}</strong></div><div class="metric"><i style="color:var(--orange)">◷</i><small>Pending parcels</small><strong>${unpaid.length}</strong></div><div class="metric"><i style="color:var(--red)">↩</i><small>Returned parcels</small><strong>${data.parcels.filter(p=>p.status==='returned').length}</strong></div></div>${due?`<div class="banner click" data-nav="reminders" style="border-color:#f0d7ad;background:#fff7e8"><div class="circle" style="background:#fff0d3;color:#aa6414">♢</div><div style="flex:1"><b style="font-size:13px">${due} Pay Later reminders need attention</b><div class="small">View overdue and due payments</div></div><span>›</span></div>`:''}<div class="sectiontitle">Quick actions</div><div class="grid2"><button class="secondary" data-nav="add">＋ Add Parcel</button><button class="secondary" data-nav="reminders">◷ Reminders</button></div><div class="sectiontitle">Recent parcels <button class="link" data-nav="parcels">View all ›</button></div>${[...data.parcels].reverse().slice(0,4).map(parcelcard).join('')||empty('No parcels yet')}`}
function empty(s){return `<div class="empty"><div>▢</div>${esc(s)}</div>`}function parcelList(){let arr=[...data.parcels].reverse().filter(p=>{let text=[p.num,p.ref,cname(p),itemnames(p)].join(' ').toLowerCase();return(!q||text.includes(q.toLowerCase()))&&(filter==='All'||(filter==='Pending'?out(p)>0:filter==='Received'?out(p)===0&&p.method!=='gift':filter==='Returned'?p.status==='returned':filter==='Draft'?p.status==='draft':filter==='Pay Later'?p.method==='credit':filter==='Free'?p.method==='gift':true))&&(!dateFilter||p.date===dateFilter)&&(!productFilter||p.items.some(i=>i.id===productFilter))&& (statusFilter==='All'||ps(p)===statusFilter)&& (methodFilter==='All'||p.method===methodFilter)});return `<div class="heading"><div><h1>All parcels</h1><p>${arr.length} of ${data.parcels.length} records</p></div><button class="iconbtn" data-act="filtertoggle">⚙</button></div><div class="search"><span>⌕</span><input id="search" placeholder="Order, VPP number, customer, product" value="${esc(q)}" autocomplete="off"><button class="link" data-act="clearsearch">✕</button></div><div class="chips">${['All','Pending','Received','Pay Later','Returned','Free','Draft'].map(x=>`<button class="chip ${filter===x?'on':''}" data-filter="${x}">${x}</button>`).join('')}</div><div id="advancedFilters" style="display:${window.showFilters?'block':'none'}" class="formgroup"><div class="field"><label>Sending date</label><input type="date" id="dateFilter" value="${esc(dateFilter)}"></div><div class="field"><label>Product</label><select id="productFilter">${select(data.products.map(p=>({value:p.id,label:p.name})),productFilter,'All products')}</select></div><div class="two"><div class="field"><label>Payment status</label><select id="statusFilter">${select(['All','Pending','Received','Partial','Overdue','Free'].map(x=>({value:x,label:x})),statusFilter)}</select></div><div class="field"><label>Payment type</label><select id="methodFilter">${select([{value:'All',label:'All'},{value:'postal',label:'Post office'},{value:'advance',label:'Advance'},{value:'credit',label:'Pay Later'},{value:'gift',label:'Gift'}],methodFilter)}</select></div></div><button class="secondary full" data-act="resetfilters">Reset filters</button></div>${arr.map(parcelcard).join('')||empty('No parcels match your search')}`}

function reports(){const unpaid=unreceived();let items=[['Outstanding',unpaid.length,unpaid.reduce((s,p)=>s+out(p),0)],['Received',data.parcels.filter(p=>paid(p)>0).length,data.parcels.reduce((s,p)=>s+paid(p),0)],['Returned',data.parcels.filter(p=>p.status==='returned').length,data.parcels.filter(p=>p.status==='returned').reduce((s,p)=>s+out(p),0)],['Gift / Free',data.parcels.filter(p=>p.method==='gift').length,0],['Credit',data.parcels.filter(p=>p.method==='credit').length,data.parcels.filter(p=>p.method==='credit').reduce((s,p)=>s+out(p),0)],['Advance',data.parcels.filter(p=>p.method==='advance').length,data.parcels.filter(p=>p.method==='advance').reduce((s,p)=>s+paid(p),0)]];return `<div class="heading"><div><h1>Reports</h1><p>Finance & parcel summaries</p></div><button class="secondary" data-act="csv">↓ CSV</button></div>${items.map(([name,count,amount])=>`<div class="card row"><div><b>${esc(name)}</b><div class="small mt">${count} parcels</div></div><strong class="money">${fmt(amount)}</strong></div>`).join('')}<div class="sectiontitle">Outstanding payment report</div>${unpaid.map(p=>`<div class="card click" data-openparcel="${p.id}"><div class="row"><b>${esc(p.num)}</b><b>${fmt(out(p))}</b></div><div class="small mt">${esc(cname(p))} · ${esc(p.date)} · ${esc(p.ref||'No post ref')} · ${pillmethod(p.method)}</div></div>`).join('')||empty('No outstanding payments')}<button class="secondary full" data-act="csv">↓ Download all parcel records (CSV)</button>`}

<button class="secondary full" data-act="additem">＋ Add another product</button></div>

elList,add,payments,more,products,customers,customerForm,reminders,reports,settings})[screen]?.()||home()}</main>${screen==='customerForm'?'':nav()}${modalHtml()}`:login())}function val(id){return document.getElementById(id)?.value??''}function syncForm(){if(screen!=='add'||!draft)return;['customer','method','weight','service','serviceCustom','ref','charge','due'].forEach(f=>{let el=document.getElementById('f-'+f);if(el)draft[f]=el.value});document.querySelectorAll('[data-item]').forEach(el=>{let i=+el.dataset.item;if(draft.items[i]){draft.items[i].id=el.value;draft.items[i].name=data.products.find(p=>p.id===el.value)?.name||'';draft.items[i].unit=draft.items[i].unit||data.products.find(p=>p.id===el.value)?.unit||'piece'}});document.querySelectorAll('[data-amount]').forEach(el=>{let i=+el.dataset.amount;if(draft.items[i])draft.items[i].amount=el.value});document.querySelectorAll('[data-price]').forEach(el=>{let i=+el.dataset.price;if(draft.items[i])draft.items[i].unitPrice=el.value});if(draft.method==='gift')draft.expected=0} function saveParcel(){syncForm();let d=draft;if(!d.customer)return toast('Select or add a customer');let cust=data.customers.find(c=>c.id===d.customer);if(!cust?.name||!cust.phone||!cust.address)return toast('Customer needs name, phone and address');
if(!d.items.length||d.items.some(i=>!i.id))return toast('Choose a product for each row');
for(let i of d.items){let n=Number(i.amount),u=unitOf(i),price=Number(i.unitPrice);if(!Number.isFinite(n)||n<=0||(u==='piece'&&!Number.isInteger(n)))return toast('Enter a valid '+(u==='kg'?'weight':'quantity'));if(d.method!=='gift'&&(!Number.isFinite(price)||price<=0))return toast('Enter the agreed price per '+(u==='kg'?'kg':'piece'));if(!Number.isFinite(price)||price<0)return toast('Price cannot be negative')}
if(d.weight!==''&&(!Number.isFinite(Number(d.weight))||Number(d.weight)<0))return toast('Enter a valid parcel weight');
if(d.charge!==''&&(!Number.isFinite(Number(d.charge))||Number(d.charge)<0))return toast('Enter valid delivery charges');
if(d.service==='Other'&&!String(d.serviceCustom||'').trim())return toast('Type your other postal service name');
if(d.ref&&!String(d.charge).trim())return toast('Enter delivery charges from the slip');
if(d.ref&&data.parcels.some(p=>p.id!==d.id&&String(serviceOf(p)).toLowerCase()===String(serviceOf(d)).toLowerCase()&&p.ref.trim().toLowerCase()===d.ref.trim().toLowerCase()))return toast('Duplicate postal reference number');
if(d.method==='gift'&&paid(d)>0)return toast('Gift parcel cannot have payments without reviewing them');if(editId&&d.method!=='gift'&&calcExpected({...d,items:d.items.map(i=>({...i,unitPrice:Number(i.unitPrice)}))})<paid(d))return toast('Product amount cannot be less than payments already received');
d.date=d.date||today();d.weight=d.weight===''?'':Number(d.weight);d.charge=Number(d.charge||0);d.items=d.items.map(i=>({id:i.id,name:data.products.find(p=>p.id===i.id)?.name||i.name,unit:unitOf(i),amount:Number(i.amount),unitPrice:d.method==='gift'?0:Number(i.unitPrice)}));d.expected=calcExpected(d);d.due=d.method==='credit'?String(d.due||''):'';d.remind=d.due;d.status=d.ref?'sent':'draft';
if(!editId){d.num='ADT-'+String(++data.seq).padStart(6,'0');data.parcels.push(d)}else{let old=data.parcels.find(p=>p.id===editId);d.payments=old.payments;Object.assign(old,d)}
save();let savedId=d.id,num=d.num;draft=null;editId=null;screen='parcels';open({type:'parcel',id:savedId});toast(num+' saved. See payment details and notes here.')}
async function payNow(){let p=data.parcels.find(x=>x.id===modal.id),amount=Number(val('pay-amount'));if(!Number.isFinite(amount)||amount<=0||amount>out(p))return toast('Enter amount up to '+fmt(out(p)));p.payments.push({id:id(),amount,date:today(),note:'',created:now()});save();modal=null;render();toast('Payment received today · '+fmt(amount))}
function csv(){let rows=[['Order','Date','Customer','Products','Weight kg','Postal type','Postal reference','Delivery charges','Collection type','Parcel status','Expected','Received','Outstanding','Due date','Payment status'],...data.parcels.map(p=>[p.num,p.date,cname(p),itemnames(p),p.weight,serviceOf(p),p.ref,p.charge,p.method,p.status,p.expected,paid(p),out(p),p.due||'',ps(p)])];download('delivtrack-parcels.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function download(name,txt,mime){let a=document.createElement('a'),blob=new Blob([txt],{type:mime});a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
app.addEventListener('click',async e=>{let b=e.target.closest('[data-nav],[data-act],[data-filter],[data-tab],[data-openparcel],[data-pay],[data-return],[data-editparcel],[data-editproduct],[data-customer],[data-remind],[data-removeitem]');if(!b)return;if(b.dataset.nav){let s=b.dataset.nav;if(s==='add'){draft=newDraft();editId=null}show(s);return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.openparcel){open({type:'parcel',id:b.dataset.openparcel});return}if(b.dataset.pay){open({type:'pay',id:b.dataset.pay});return}if(b.dataset.return){open({type:'return',id:b.dataset.return});return}if(b.dataset.editparcel){draft=newDraft(data.parcels.find(p=>p.id===b.dataset.editparcel));editId=draft.id;show('add');return}if(b.dataset.editproduct){open({type:'product',id:b.dataset.editproduct});return}if(b.dataset.customer){open({type:'customerInfo',id:b.dataset.customer});return}if(b.dataset.remind){open({type:'remind',id:b.dataset.remind});return}if(b.dataset.removeitem){syncForm();if(draft.items.length>1)draft.items.splice(Number(b.dataset.removeitem),1);render();return}let a=b.dataset.act;switch(a){case'notifications':open({type:'notifications'});break;case'close':case'closeOverlay':modal=null;render();break;case'addproduct':open({type:'product'});break;case'addcustomer':case'inlinecustomer':if(a==='inlinecustomer')syncForm();customerReturnScreen=a==='inlinecustomer'?'add':'customers';customerDraft={id:'',name:'',phone:'',address:''};show('customerForm');break;
case'backcustomer':customerDraft=null;show(customerReturnScreen);break;case'filtertoggle':window.showFilters=!window.showFilters;render();break;case'clearsearch':q='';render();break;case'resetfilters':dateFilter='';productFilter='';statusFilter='All';methodFilter='All';render();break;case'additem':syncForm();draft.items.push({id:'',name:'',amount:1,unitPrice:''});render();break;case'discard':draft=null;editId=null;show('parcels');break;case'saveparcel':saveParcel();break;case'confirmPay':await payNow();break;case'confirmReturn':{let p=data.parcels.find(x=>x.id===modal.id);p.status='returned';p.returnDate=today();p.returnReason=val('return-reason');save();modal=null;render();toast('Parcel marked as returned');break}case'saveproduct':{let name=val('product-name').trim(),unit=val('product-unit');if(!name||!['piece','kg'].includes(unit))return toast('Enter a name and choose piece or kg');let p=data.products.find(x=>x.id===modal.id);if(p){p.name=name;p.unit=unit}else data.products.push({id:id(),name,unit,active:true});save();modal=null;render();toast('Product saved');break}case'archiveproduct':{let p=data.products.find(x=>x.id===modal.id);p.active=!p.active;save();modal=null;render();toast(p.active?'Product activated':'Product archived');break}case'savecustomer':{let name=val('customer-name').trim(),phone=val('customer-phone').trim(),address=val('customer-address').trim();if(!name||!phone||!address)return toast('Name, phone and address are all required');if(!/^\+?[0-9\s-]{10,18}$/.test(phone))return toast('Enter a valid phone number');let c=data.customers.find(x=>x.id===customerDraft?.id);if(c){c.name=name;c.phone=phone;c.address=address}else{c={id:id(),name,phone,address};data.customers.push(c)}if(customerReturnScreen==='add'&&draft)draft.customer=c.id;save();customerDraft=null;show(customerReturnScreen);toast('Customer saved');break}case'editcustomer':{let c=data.customers.find(x=>x.id===modal.id);customerDraft={...c};customerReturnScreen='customers';show('customerForm');break}case'editnotes':{let pid=modal.id;open({type:'notes',id:pid});break}case'saveNotes':{let p=data.parcels.find(x=>x.id===modal.id);p.note=val('parcel-notes');save();open({type:'parcel',id:p.id});toast('Notes saved');break}case'allowNotif':{if(!('Notification' in window)){toast('Browser notifications are not available');break}Notification.requestPermission().then(r=>{toast(r==='granted'?'Notifications enabled while demo is open':'Notification permission not granted');maybeNotify()});break}case'saveReminder':{let p=data.parcels.find(x=>x.id===modal.id);p.due=val('new-due');p.remind=p.due;save();modal=null;render();toast(p.due?'Reminder date saved':'Reminder date cleared');break}case'csv':csv();break;case'json':download('delivtrack-demo-backup.json',JSON.stringify(data,null,2),'application/json');break;case'reset':if(confirm('Reset all demo data to the example records?')){data=init();save();show('home');toast('Demo reset')};break;case'logout':data.logged=false;save();render();break;case'login':data.logged=true;save();show('home');break;}});

if(screen==='add'&&draft){if(t.id==='f-method'){syncForm();draft.method=t.value;draft.service=autoService(t.value);draft.serviceCustom='';if(t.value!=='credit'){draft.due='';draft.remind=''}if(t.value==='gift')draft.expected=0;render();return}if(t.id==='f-service'){syncForm();render();return}if(t.classList.contains('item-product')){let before=Number(t.dataset.item);syncForm();let selected=data.products.find(p=>p.id===draft.items[before].id);draft.items[before].amount=1;draft.items[before].unit=selected?.unit||'piece';draft.items[before].unitPrice='';render();return}syncForm()}});render();setTimeout(maybeNotify,1500);setInterval(maybeNotify,60000);})();
