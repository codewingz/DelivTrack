# Continuous integration for DelivTrack. NOT ACTIVE until this file is pushed to GitHub (owner decision).
# Jobs: checks (format, analyze, unit + widget tests), rules (Firestore rules on the emulator),
# repository (the real Firestore repositories on an Android emulator against the Firebase emulators),
# build (debug APK). No secrets are used; release builds and signing are not part of CI.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8   # the version the project is developed and tested with
  FIREBASE_TOOLS_VERSION: 15.4.0   # the version used locally

jobs:
  checks:
    name: Format, analyze, unit and widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dart format (fails when a file is not formatted)
        run: dart format --output=none --set-exit-if-changed lib test test_emulator
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  rules:
    name: Firestore rules (two real users, emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: flutter pub get
      - name: Rules tests
        run: firebase emulators:exec --only auth,firestore --project delivtrack-codewingz "flutter test test/rules"

  repository:
    name: Repositories on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: flutter pub get
      - name: Repository tests (real transactions against the Firebase emulators)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            firebase emulators:exec --only auth,firestore --project delivtrack-codewingz
            "sh test_emulator/run.sh $(adb devices | awk 'NR==2 {print $1}')"

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
